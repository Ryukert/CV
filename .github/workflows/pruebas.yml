name: Pruebas

# En cada push y Pull Request: tipos de TypeScript, compilación de Next.js, pruebas de humo,
# pruebas en navegador y exportación a RenderCV. Si algo falla, GitHub lo marca en rojo
# antes de publicar.
on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/navegador/package-lock.json

      - name: Dependencias
        run: npm ci --no-fund --no-audit

      - name: Compilación (incluye la revisión de tipos)
        run: npm run build

      - name: Pruebas de humo
        run: npm test

      - name: Pruebas en navegador (buscador, tema, copiar, sin JavaScript)
        working-directory: tests/navegador
        env:
          CI: 'true'
          NAVEGADOR: /usr/bin/google-chrome
        run: |
          npm ci --no-fund --no-audit
          node navegador.mjs

      - name: Exportación a RenderCV (YAML válido)
        run: |
          node herramientas/rendercv.ts es
          node herramientas/rendercv.ts en
          node -e 'for (const l of ["es","en"]) { const t = require("fs").readFileSync(`versiones/base/cv-${l}.yaml`, "utf8"); const j = JSON.parse(t.replace(/^#.*\n/gm, "")); if (!j.cv?.sections) { console.error(`YAML ${l} inválido`); process.exit(1); } } console.log("ok");'
